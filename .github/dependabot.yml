version: 2
registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    username: x-access-token
    password: ${{secrets.PACKAGES_READ_TOKEN}}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - github-npm
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
