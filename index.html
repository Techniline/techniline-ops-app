<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techniline Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- ========== LOGIN SCREEN ========== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
      <h1 class="text-2xl font-bold text-center mb-1">Techniline Ops</h1>
      <p class="text-sm text-slate-500 text-center mb-6">Sign in to see your tasks</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input id="login-email" type="email" required autocomplete="username"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" id="login-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">
          Sign in
        </button>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
      </form>
    </div>
  </div>

  <!-- ========== CHECKLIST SCREEN ========== -->
  <div id="checklist-screen" class="hidden max-w-3xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-2xl font-bold">Today's Checklist</h1>
        <p id="today-date" class="text-sm text-slate-500"></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-email" class="text-sm text-slate-600 hidden sm:inline"></span>
        <button id="signout-btn"
          class="text-sm px-3 py-1 border border-slate-300 rounded-lg hover:bg-slate-100">Sign out</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-slate-700">Daily progress</span>
        <span id="progress-text" class="text-sm text-slate-500">0 of 0 done</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="bg-green-500 h-2 rounded-full transition-all" style="width:0%"></div>
      </div>
    </div>

    <h2 class="text-lg font-semibold mt-2 mb-2">Daily tasks</h2>
    <div id="daily-tasks" class="space-y-3"></div>

    <h2 class="text-lg font-semibold mt-6 mb-2">Email-triggered actions</h2>
    <div id="expected-actions" class="space-y-3"></div>
  </div>

  <script>
    // ============ CONFIG ============
    const SUPABASE_URL = "https://xtvjzpmmuryaoluhynvl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0dmp6cG1tdXJ5YW9sdWh5bnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjUzNTIsImV4cCI6MjA5NTM0MTM1Mn0.2tXY9dSYG7w_wcv6fs0XRvWMvbtcNzMHVw_kVAEVxt8";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Titles that use the multi-tag input pattern
    const MULTI_TAG_VENDOR_INVOICING = "Vendor invoicing";
    const MULTI_TAG_APPOINTMENT = "Appointment booking";
    const MULTI_TAG_SRTPRT = "SRT / PRT backlog clearance";

    // ============ DOM ============
    const loginScreen = document.getElementById("login-screen");
    const checklistScreen = document.getElementById("checklist-screen");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const userEmailEl = document.getElementById("user-email");
    const todayDateEl = document.getElementById("today-date");
    const dailyTasksEl = document.getElementById("daily-tasks");
    const expectedActionsEl = document.getElementById("expected-actions");
    const progressTextEl = document.getElementById("progress-text");
    const progressBarEl = document.getElementById("progress-bar");
    const signoutBtn = document.getElementById("signout-btn");

    // ============ HELPERS ============
    function todayISO() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }
    function prettyDate() {
      return new Date().toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric",
      });
    }
    function prettyTime(iso) {
      const d = iso ? new Date(iso) : new Date();
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return hh + ":" + mm;
    }
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // ============ SCREENS ============
    function showLogin() {
      checklistScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    }
    function showChecklist(user) {
      loginScreen.classList.add("hidden");
      checklistScreen.classList.remove("hidden");
      userEmailEl.textContent = user.email || "";
      todayDateEl.textContent = prettyDate();
      loadDailyTasks(user);
      loadExpectedActions(user);
    }

    // ============ LOGIN ============
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = error.message;
        loginError.classList.remove("hidden");
        return;
      }
      showChecklist(data.user);
    });

    signoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      showLogin();
    });

    // ============ PROGRESS ============
    function updateProgress(tasks) {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === "submitted" || t.status === "verified").length;
      progressTextEl.textContent = done + " of " + total + " done";
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      progressBarEl.style.width = pct + "%";
    }

    // ============ DAILY TASKS ============
    let dailyTasksCache = [];

    async function loadDailyTasks(user) {
      dailyTasksEl.innerHTML = '<p class="text-sm text-slate-500">Loading...</p>';
      const { data, error } = await sb
        .from("daily_tasks")
        .select("id, status, task_date, task_def_id, task_definitions(title, evidence_hint, evidence_type)")
        .eq("assigned_to", user.id)
        .eq("task_date", todayISO())
        .order("id");
      if (error) {
        dailyTasksEl.innerHTML = '<p class="text-sm text-red-600">Failed to load: ' + escapeHtml(error.message) + '</p>';
        return;
      }
      dailyTasksCache = data || [];
      renderDailyTasks();
    }

    function getRenderMode(task) {
      const def = task.task_definitions || {};
      if (def.title === MULTI_TAG_VENDOR_INVOICING) return "tag_single_invoice";
      if (def.title === MULTI_TAG_APPOINTMENT) return "tag_single_appointment";
      if (def.title === MULTI_TAG_SRTPRT) return "tag_double_srt_prt";
      if (def.evidence_type === "one_tap") return "one_tap";
      return "text"; // catch-all for text and id_list
    }

    function renderDailyTasks() {
      updateProgress(dailyTasksCache);
      if (dailyTasksCache.length === 0) {
        dailyTasksEl.innerHTML = '<div class="bg-white rounded-xl shadow-sm p-4 text-sm text-slate-500">No daily tasks for today.</div>';
        return;
      }
      dailyTasksEl.innerHTML = dailyTasksCache.map(renderDailyCard).join("");
      dailyTasksCache.forEach(task => {
        const cardEl = document.getElementById("task-" + task.id);
        if (!cardEl) return;
        const isDone = task.status === "submitted" || task.status === "verified";
        if (isDone) return;
        attachCardHandlers(task, cardEl);
      });
    }

    function renderDailyCard(task) {
      const def = task.task_definitions || {};
      const title = def.title || "(no title)";
      const hint = def.evidence_hint || "";
      const isDone = task.status === "submitted" || task.status === "verified";
      const mode = getRenderMode(task);

      if (isDone) {
        const submittedAt = task.submitted_at_local || prettyTime();
        return `
        <div id="task-${task.id}" class="bg-green-50 border border-green-200 rounded-xl shadow-sm p-4">
          <div class="flex items-start gap-3">
            <div class="text-green-600 text-xl leading-none">&#10003;</div>
            <div class="flex-1">
              <p class="font-medium text-green-800 line-through">${escapeHtml(title)}</p>
              <p class="text-xs text-green-700 mt-1">Submitted at ${escapeHtml(submittedAt)}</p>
            </div>
          </div>
        </div>`;
      }

      if (mode === "one_tap") {
        return `
        <div id="task-${task.id}" class="bg-white rounded-xl shadow-sm p-4">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1">
              <p class="font-medium">${escapeHtml(title)}</p>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(hint)}</p>
            </div>
            <button data-action="confirm"
              class="shrink-0 bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg">
              Confirm
            </button>
          </div>
        </div>`;
      }

      if (mode === "tag_single_invoice") {
        return tagSingleCard(task, title, hint, "Invoice numbers", "Add invoice number", "e.g. WS/2601519", "No invoices to raise today");
      }
      if (mode === "tag_single_appointment") {
        return tagSingleCard(task, title, hint, "Appointment IDs", "Add appointment ID", "e.g. APT-2461", "No appointments to book today");
      }
      if (mode === "tag_double_srt_prt") {
        return tagDoubleCard(task, title, hint);
      }

      // fallback: text/id_list
      return `
        <div id="task-${task.id}" class="bg-white rounded-xl shadow-sm p-4">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1">
              <p class="font-medium">${escapeHtml(title)}</p>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(hint)}</p>
            </div>
            <button data-action="expand"
              class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg">
              Add details
            </button>
          </div>
          <div data-role="input-wrap" class="hidden mt-3">
            <textarea rows="3" placeholder="Type your notes (min 10 characters)..."
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
            <div class="flex justify-end mt-2">
              <button data-action="submit-text" disabled
                class="bg-green-600 hover:bg-green-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium px-3 py-1.5 rounded-lg">
                Submit
              </button>
            </div>
          </div>
        </div>`;
    }

    function tagSingleCard(task, title, hint, fieldLabel, addBtnLabel, placeholder, nothingLabel) {
      return `
        <div id="task-${task.id}" class="bg-white rounded-xl shadow-sm p-4">
          <div class="mb-3">
            <p class="font-medium">${escapeHtml(title)}</p>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(hint)}</p>
          </div>
          <label class="block text-sm font-medium text-slate-700 mb-1">${escapeHtml(fieldLabel)}</label>
          <div class="flex gap-2 mb-2">
            <input type="text" data-role="tag-input" placeholder="${escapeHtml(placeholder)}"
              class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
            <button data-action="add-tag"
              class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-3 py-2 rounded-lg">Add</button>
          </div>
          <div data-role="tag-list" class="flex flex-wrap gap-2 mb-3"></div>
          <p data-role="count-text" class="text-xs text-slate-500 mb-3">0 added</p>
          <div class="flex justify-between items-center">
            <button data-action="nothing" data-note="${escapeHtml(nothingLabel)}"
              class="text-sm text-slate-600 underline hover:text-slate-800">${escapeHtml(nothingLabel)}</button>
            <button data-action="submit-tags" disabled
              class="bg-green-600 hover:bg-green-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium px-3 py-1.5 rounded-lg">
              Submit
            </button>
          </div>
        </div>`;
    }

    function tagDoubleCard(task, title, hint) {
      return `
        <div id="task-${task.id}" class="bg-white rounded-xl shadow-sm p-4">
          <div class="mb-3">
            <p class="font-medium">${escapeHtml(title)}</p>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(hint)}</p>
          </div>

          <div class="mb-3" data-group="srt">
            <label class="block text-sm font-medium text-slate-700 mb-1">SRT ticket numbers</label>
            <div class="flex gap-2 mb-2">
              <input type="text" data-role="tag-input" placeholder="e.g. SRT-0041"
                class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
              <button data-action="add-tag"
                class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-3 py-2 rounded-lg">Add</button>
            </div>
            <div data-role="tag-list" class="flex flex-wrap gap-2"></div>
          </div>

          <div class="mb-3" data-group="prt">
            <label class="block text-sm font-medium text-slate-700 mb-1">PRT ticket numbers</label>
            <div class="flex gap-2 mb-2">
              <input type="text" data-role="tag-input" placeholder="e.g. PRT-0017"
                class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
              <button data-action="add-tag"
                class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-3 py-2 rounded-lg">Add</button>
            </div>
            <div data-role="tag-list" class="flex flex-wrap gap-2"></div>
          </div>

          <p data-role="count-text" class="text-xs text-slate-500 mb-3">0 added</p>

          <div class="flex justify-between items-center">
            <button data-action="nothing" data-note="Backlog is clear"
              class="text-sm text-slate-600 underline hover:text-slate-800">Backlog is clear</button>
            <button data-action="submit-tags" disabled
              class="bg-green-600 hover:bg-green-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium px-3 py-1.5 rounded-lg">
              Submit
            </button>
          </div>
        </div>`;
    }

    function attachCardHandlers(task, cardEl) {
      const mode = getRenderMode(task);
      if (mode === "one_tap") {
        const btn = cardEl.querySelector("[data-action='confirm']");
        if (btn) btn.addEventListener("click", () => handleOneTap(task, btn));
        return;
      }
      if (mode === "text") {
        const expandBtn = cardEl.querySelector("[data-action='expand']");
        const submitBtn = cardEl.querySelector("[data-action='submit-text']");
        const textarea = cardEl.querySelector("textarea");
        const inputWrap = cardEl.querySelector("[data-role='input-wrap']");
        if (expandBtn) {
          expandBtn.addEventListener("click", () => {
            expandBtn.classList.add("hidden");
            inputWrap.classList.remove("hidden");
            textarea.focus();
          });
        }
        if (textarea && submitBtn) {
          textarea.addEventListener("input", () => {
            submitBtn.disabled = textarea.value.trim().length < 10;
          });
          submitBtn.addEventListener("click", () => handleTextSubmit(task, textarea.value.trim(), submitBtn));
        }
        return;
      }
      // tag modes
      const groups = cardEl.querySelectorAll("[data-group]");
      if (groups.length > 0) {
        // double (SRT/PRT)
        groups.forEach(g => wireTagGroup(g, cardEl));
      } else {
        // single
        wireTagGroup(cardEl, cardEl);
      }
      const submitBtn = cardEl.querySelector("[data-action='submit-tags']");
      const nothingBtn = cardEl.querySelector("[data-action='nothing']");
      if (submitBtn) {
        submitBtn.addEventListener("click", () => handleTagSubmit(task, cardEl, submitBtn));
      }
      if (nothingBtn) {
        nothingBtn.addEventListener("click", () => handleNothingTodo(task, nothingBtn.getAttribute("data-note"), nothingBtn));
      }
    }

    function wireTagGroup(scope, cardEl) {
      const input = scope.querySelector("[data-role='tag-input']");
      const addBtn = scope.querySelector("[data-action='add-tag']");
      const list = scope.querySelector("[data-role='tag-list']");
      if (!input || !addBtn || !list) return;
      function addTag() {
        const val = input.value.trim();
        if (!val) return;
        const tag = document.createElement("span");
        tag.className = "inline-flex items-center gap-1 bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded-full";
        tag.dataset.value = val;
        tag.innerHTML = escapeHtml(val) + ' <button type="button" class="text-blue-600 hover:text-blue-900" data-action="remove-tag" aria-label="Remove">&times;</button>';
        list.appendChild(tag);
        input.value = "";
        input.focus();
        updateTagState(cardEl);
      }
      addBtn.addEventListener("click", addTag);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); addTag(); }
      });
      list.addEventListener("click", (e) => {
        if (e.target.matches("[data-action='remove-tag']")) {
          e.target.closest("[data-value]").remove();
          updateTagState(cardEl);
        }
      });
    }

    function collectTags(cardEl) {
      // Returns array of all tag values across all tag-lists in the card, in order
      const tags = cardEl.querySelectorAll("[data-role='tag-list'] [data-value]");
      return Array.from(tags).map(el => el.dataset.value);
    }

    function updateTagState(cardEl) {
      const count = collectTags(cardEl).length;
      const countEl = cardEl.querySelector("[data-role='count-text']");
      if (countEl) countEl.textContent = count + (count === 1 ? " added" : " added");
      const submitBtn = cardEl.querySelector("[data-action='submit-tags']");
      if (submitBtn) submitBtn.disabled = count < 1;
    }

    // ============ SUBMIT HANDLERS ============
    async function handleOneTap(task, btn) {
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "Saving...";
      const { data: { user } } = await sb.auth.getUser();
      const hint = (task.task_definitions && task.task_definitions.evidence_hint) || "";
      const { error: insErr } = await sb.from("submissions").insert({
        daily_task_id: task.id,
        submitted_by: user.id,
        is_nothing_to_action: true,
        nothing_to_action_note: hint,
      });
      if (insErr) { alert("Could not save: " + insErr.message); btn.disabled=false; btn.textContent=original; return; }
      const { error: updErr } = await sb.from("daily_tasks").update({ status: "submitted" }).eq("id", task.id);
      if (updErr) { alert("Saved but status update failed: " + updErr.message); btn.disabled=false; btn.textContent=original; return; }
      task.status = "submitted"; task.submitted_at_local = prettyTime(); renderDailyTasks();
    }

    async function handleTextSubmit(task, text, btn) {
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "Saving...";
      const { data: { user } } = await sb.auth.getUser();
      const { error: insErr } = await sb.from("submissions").insert({
        daily_task_id: task.id,
        submitted_by: user.id,
        evidence_text: text,
      });
      if (insErr) { alert("Could not save: " + insErr.message); btn.disabled=false; btn.textContent=original; return; }
      const { error: updErr } = await sb.from("daily_tasks").update({ status: "submitted" }).eq("id", task.id);
      if (updErr) { alert("Saved but status update failed: " + updErr.message); btn.disabled=false; btn.textContent=original; return; }
      task.status = "submitted"; task.submitted_at_local = prettyTime(); renderDailyTasks();
    }

    async function handleTagSubmit(task, cardEl, btn) {
      const tags = collectTags(cardEl);
      if (tags.length < 1) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "Saving...";
      const { data: { user } } = await sb.auth.getUser();
      const { error: insErr } = await sb.from("submissions").insert({
        daily_task_id: task.id,
        submitted_by: user.id,
        evidence_text: tags.join(", "),
        evidence_count: tags.length,
      });
      if (insErr) { alert("Could not save: " + insErr.message); btn.disabled=false; btn.textContent=original; return; }
      const { error: updErr } = await sb.from("daily_tasks").update({ status: "submitted" }).eq("id", task.id);
      if (updErr) { alert("Saved but status update failed: " + updErr.message); btn.disabled=false; btn.textContent=original; return; }
      task.status = "submitted"; task.submitted_at_local = prettyTime(); renderDailyTasks();
    }

    async function handleNothingTodo(task, note, btn) {
      btn.disabled = true;
      const { data: { user } } = await sb.auth.getUser();
      const { error: insErr } = await sb.from("submissions").insert({
        daily_task_id: task.id,
        submitted_by: user.id,
        is_nothing_to_action: true,
        nothing_to_action_note: note,
        evidence_count: 0,
      });
      if (insErr) { alert("Could not save: " + insErr.message); btn.disabled=false; return; }
      const { error: updErr } = await sb.from("daily_tasks").update({ status: "submitted" }).eq("id", task.id);
      if (updErr) { alert("Saved but status update failed: " + updErr.message); btn.disabled=false; return; }
      task.status = "submitted"; task.submitted_at_local = prettyTime(); renderDailyTasks();
    }

    // ============ EXPECTED ACTIONS ============
    async function loadExpectedActions(user) {
      expectedActionsEl.innerHTML = '<p class="text-sm text-slate-500">Loading...</p>';
      const { data, error } = await sb
        .from("expected_actions")
        .select("id, type, ref_number, aed_amount, email_received_at, status")
        .eq("assigned_to", user.id)
        .eq("status", "open")
        .order("email_received_at");
      if (error) {
        expectedActionsEl.innerHTML = '<p class="text-sm text-red-600">Failed to load: ' + escapeHtml(error.message) + '</p>';
        return;
      }
      if (!data || data.length === 0) {
        expectedActionsEl.innerHTML = '<div class="bg-white rounded-xl shadow-sm p-4 text-sm text-slate-500">No open email-triggered actions. 🎉</div>';
        return;
      }
      expectedActionsEl.innerHTML = data.map(a => {
        const label = (a.type || "") + (a.ref_number ? " #" + a.ref_number : "");
        const aed = a.aed_amount ? "AED " + a.aed_amount : "";
        return `
          <div id="ea-${a.id}" class="bg-white rounded-xl shadow-sm p-4">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1">
                <p class="font-medium">${escapeHtml(label)}</p>
                <p class="text-xs text-slate-500 mt-1">${escapeHtml(aed)}</p>
              </div>
              <button data-id="${a.id}" data-action="action"
                class="shrink-0 bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg">
                Mark actioned
              </button>
            </div>
          </div>`;
      }).join("");
      expectedActionsEl.querySelectorAll("[data-action='action']").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const id = btn.getAttribute("data-id");
          const { error } = await sb.from("expected_actions").update({ status: "actioned" }).eq("id", id);
          if (error) { alert("Could not update: " + error.message); btn.disabled=false; return; }
          loadExpectedActions(user);
        });
      });
    }

    // ============ INIT ============
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) showChecklist(session.user);
      else showLogin();
    })();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") showLogin();
    });
  </script>
</body>
</html>
